<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>
        ImadFit - {% block title %}{% endblock %}
    </title>


    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link href="/static/styles.css" rel="stylesheet">

</head>

<body>

    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">

    <div class="container">


        <!-- Logo -->
        <a class="navbar-brand fw-bold" href="/">
            💪 ImadFit
        </a>


        <!-- Mobile button -->
        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbar">

            <span class="navbar-toggler-icon"></span>

        </button>



        <div class="collapse navbar-collapse" id="navbar">


            <!-- Left side -->
            <ul class="navbar-nav me-auto">

                <li class="nav-item">
                    <a class="nav-link" href="/">
                        Home
                    </a>
                </li>


                <li class="nav-item">
                    <a class="nav-link" href="/exercises">
                        Exercises
                    </a>
                </li>


                <li class="nav-item">
                    <a class="nav-link" href="/workouts">
                        My Workouts
                    </a>
                </li>

            </ul>



            <!-- Right side -->
            <ul class="navbar-nav">


{% if logged_in %}


    <li class="nav-item">
        <a class="nav-link" href="/profile">
            {{ current_user["username"] }}
        </a>
    </li>
{% if current_user["is_admin"] == 1 %}

    <li class="nav-item">
        <a class="nav-link" href="/admin">
            Admin
        </a>
    </li>

{% endif %}


    <li class="nav-item">
        <a class="btn btn-danger ms-2" href="/logout">
            Logout
        </a>
    </li>


{% else %}


    <li class="nav-item">
        <a class="nav-link" href="/login">
            Login
        </a>
    </li>


    <li class="nav-item">
        <a class="btn btn-primary ms-2" href="/register">
            Register
        </a>
    </li>


{% endif %}


</ul>


        </div>


    </div>

</nav>

    <main>
        {% block main %}{% endblock %}
    </main>
<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script src="/static/workout.js"></script>
</body>

</html>

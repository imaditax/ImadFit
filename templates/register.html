{% extends "layout.html" %}

{% block title %}
Register
{% endblock %}


{% block main %}
<div class="container text-center mt-5">
    <h1 class="display-4 fw-bold">
        Become a Member
    </h1>


<form action="/register" method="post">

    <input
        class="form-control "
        autocomplete="off"
        name="username"
        placeholder="Username"
        type="text">

    <br><br>


    <input
        class="form-control "
        name="password"
        placeholder="Password"
        type="password">

    <br><br>


    <input
        class="form-control "
        name="confirmation"
        placeholder="Confirm password"
        type="password">

    <br><br>


    <button type="submit" class="btn btn-primary btn-lg mt-3">
        Register
    </button>

</form>
</div>

{% endblock %}
